spring:
  application:
    name: vault-keeper-api
  # Perfil padrão: H2 em memória, sem instalar nada.
  datasource:
    url: jdbc:h2:mem:vault;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,MONTH
  jpa:
    hibernate:
      ddl-auto: create-drop   # só para desenvolvimento: recria as tabelas
    open-in-view: false
  test:
    database:
      replace: none         # os testes usam a MESMA configuração do H2 acima

# Segredos vêm de VARIÁVEIS DE AMBIENTE (nunca escritos no código).
# Sem elas a API nem sobe: é de propósito.
app:
  auth:
    username: ${APP_ADMIN_USER}
    password-hash: ${APP_ADMIN_PASSWORD_HASH}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-hours: 12
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  # Id do usuário dono das revistas (auth.users.id). O padrão só serve para o H2 local;
  # com o perfil "supabase" a variável APP_OWNER_ID é obrigatória.
  owner-id: ${APP_OWNER_ID:00000000-0000-0000-0000-000000000001}
